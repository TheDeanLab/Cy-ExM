schema_version: 1
dataset_id: explicit-rotation-example
voxel_spacing_um: {x: 0.324, y: 0.324, z: 0.900}
reference:
  round: 2
  registration_channel: round_2_488_registration.tif
  channels:
    - {file: round_2_488_registration.tif}
registration:
  crop: false
  linear: {type: TRSAA, accuracy: high}
  nonlinear: {type: SyNOnly, accuracy: high, metric: mattes}
rounds:
  - round: 1
    strategy: whole_image
    registration_channel: round_1_488_registration.tif
    initial_alignment:
      xy_rotation: {mode: explicit, angle_deg: 27.7}
    channels:
      - {file: round_1_488_registration.tif, interpolation: linear}
      - {file: round_1_647_target.tif, interpolation: linear}
