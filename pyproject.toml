[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cy-exm"
version = "0.1.0"
description = "Reusable cyclic expansion microscopy registration workflows."
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.12,<3.13"
authors = [{name = "The Dean Lab, UT Southwestern Medical Center"}]
dependencies = [
  "antspyx>=0.6,<0.7",
  "numpy>=1.26,<3",
  "scikit-image>=0.22,<1",
  "scipy>=1.12,<2",
  "tifffile>=2025.1.10",
]

[project.scripts]
cyexm = "cyexm.cli:main"

[project.optional-dependencies]
examples = ["jupyterlab>=4", "matplotlib>=3.8", "nbconvert>=7"]
workflow = ["PyYAML>=6,<7"]
distributed = [
  "PyYAML>=6,<7",
  "dask==2025.1.0",
  "distributed==2025.1.0",
]
hpc = [
  "PyYAML>=6,<7",
  "dask==2025.1.0",
  "distributed==2025.1.0",
  "dask-jobqueue==0.9.0",
]

[dependency-groups]
dev = [
  "basedpyright==1.38.3",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.14.8",
]
docs = ["jupyter-book==2.1.6"]

[project.urls]
Documentation = "https://thedeanlab.github.io/Cy-ExM/"
Source = "https://github.com/TheDeanLab/Cy-ExM"

[tool.uv]
required-version = "==0.7.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: isolated or mocked checks",
  "integration: bounded checks using real scientific libraries",
  "hpc: checks requiring lab storage, representative data, or cluster services",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
include = ["src/cyexm"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
