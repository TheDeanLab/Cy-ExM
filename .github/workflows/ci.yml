name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Portable Phase 1 gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.7.13"
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --group dev --extra examples
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: BasedPyright
        run: uv run basedpyright
      - name: Unit tests
        run: uv run pytest -m "unit and not hpc" tests/unit -v
      - name: Bounded integration tests
        run: uv run pytest -m "integration and not hpc" tests/integration -v
