schema_version: 1
executor: slurm

# Fine mode can admit one scientific task in each isolated worker process.
parallelism:
  mode: fine_grained

paths:
  # Site-specific editable shared dataset path; do not use this placeholder as-is.
  dataset_root: /archive/path/to/dataset
  # Site-specific editable shared results path; keep it disjoint from dataset_root.
  output_root: /archive/path/to/results
  # Site-specific editable worker scratch path; keep active scratch off /archive.
  worker_local_directory: /project/path/to/cyexm-worker

# Thirty cores per job divided by two processes gives 15 cores per process.
native_threads:
  itk: 15
  blas: 15

# workers is a three-job/node cap. Two processes per job provide at most six slots.
slurm:
  queue: 512GB
  workers: 3
  cores_per_worker: 30
  processes_per_worker: 2
  memory: 500GB
  walltime: "72:00:00"
  interface: ib0
  scheduler_interface: ib0
  startup_timeout: "15m"
  task_retries: 0
  job_name: cyexm-registration-multiprocess
  job_extra_directives:
    - --exclusive
